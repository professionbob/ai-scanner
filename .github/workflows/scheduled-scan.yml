name: Scheduled stock scan

on:
  schedule:
    # Offset from :00/:15/:30/:45 to reduce GitHub Actions peak-time delays.
    - cron: "7,22,37,52 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: .scanner-state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Run one scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_STATE_PATH: .scanner-state/state.json
          US_BATCH_SIZE: "20"
          TW_BATCH_SIZE: "30"
          MAX_RUN_SECONDS: "720"
        run: python main.py

      - name: Generate encrypted dashboard data
        run: python dashboard_export.py --state .scanner-state/state.json --output .scanner-state/dashboard-data.enc --public-key dashboard_public_key.pem

      - name: Save scanner state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .scanner-state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check out encrypted data branch
        if: success()
        uses: actions/checkout@v4
        with:
          ref: dashboard-data
          path: .dashboard-publish

      - name: Publish encrypted dashboard snapshot
        if: success()
        run: |
          mkdir -p .dashboard-publish/dashboard
          cp .scanner-state/dashboard-data.enc .dashboard-publish/dashboard/data.enc
          cd .dashboard-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.enc
          git diff --cached --quiet || git commit -m "Update encrypted dashboard snapshot"
          git push
