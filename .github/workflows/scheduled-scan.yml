name: Scheduled stock scan

on:
  schedule:
    # Offset from :00/:15/:30/:45 to reduce GitHub Actions peak-time delays.\n    - cron: "7,22,37,52 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: .scanner-state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Run one scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_STATE_PATH: .scanner-state/state.json
          US_BATCH_SIZE: "20"
          TW_BATCH_SIZE: "30"
          MAX_RUN_SECONDS: "720"
        run: python main.py

      - name: Save scanner state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .scanner-state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
